[project]
name = "rag"
version = "0.1.0"
description = "RAG system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.8.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-excel-loader>=0.1.1",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.2",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
